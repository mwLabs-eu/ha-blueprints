blueprint:
  name: Garten Bewässerung – Wetterbasiert (Sonoff Zigbee Valve)
  description: >
    Steuert ein Sonoff Zigbee-Ventil (Z2M) zur Gartenbewässerung.
    Gießzeit und Vorlaufzeit vor Sonnenaufgang werden anhand der
    maximal vorhergesagten Tagestemperatur (weather.get_forecasts, daily)
    dynamisch bestimmt. Regen-Skip inklusive.
    Mit Fehlerprüfung: Ventil-Status nach Befehlen validiert,
    Benachrichtigung bei Fehlschlag.
  domain: automation
  input:
    valve_entity:
      name: Ventil-Entity
      selector:
        entity:
          domain: switch
    weather_entity:
      name: Wetter-Entity
      selector:
        entity:
          domain: weather
    notify_service:
      name: Benachrichtigungs-Service
      description: >
        z.B. notify.mobile_app_dein_handy oder notify.telegram
      default: notify.notify
      selector:
        text:
    temp_cold_threshold:
      name: Schwelle "kalt" (°C, max. Tagestemperatur darunter)
      default: 18
      selector:
        number:
          min: 0
          max: 40
          unit_of_measurement: "°C"
    temp_hot_threshold:
      name: Schwelle "heiß" (°C, max. Tagestemperatur darüber)
      default: 28
      selector:
        number:
          min: 0
          max: 45
          unit_of_measurement: "°C"
    duration_cold:
      name: Gießdauer bei kaltem Wetter (Minuten)
      default: 5
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
    duration_medium:
      name: Gießdauer bei mittlerem Wetter (Minuten)
      default: 10
      selector:
        number:
          min: 0
          max: 180
          unit_of_measurement: min
    duration_hot:
      name: Gießdauer bei heißem Wetter (Minuten)
      default: 20
      selector:
        number:
          min: 0
          max: 240
          unit_of_measurement: min
    rain_skip_threshold:
      name: Regen-Schwelle für Skip (mm, Tagessumme)
      default: 2
      selector:
        number:
          min: 0
          max: 50
          unit_of_measurement: mm
    status_check_delay:
      name: Wartezeit vor Statusprüfung nach Befehl (Sekunden)
      default: 3
      selector:
        number:
          min: 1
          max: 10
          unit_of_measurement: s

trigger:
  - trigger: sun
    event: sunrise
    offset: "-02:00:00"

condition: []

action:
  - action: weather.get_forecasts
    target:
      entity_id: !input weather_entity
    data:
      type: daily
    response_variable: forecast_response

  - variables:
      weather_entity_id: !input weather_entity
      heutiges_forecast: "{{ forecast_response[weather_entity_id].forecast[0] }}"
      max_temp: "{{ heutiges_forecast.temperature | float(0) }}"
      niederschlag: "{{ heutiges_forecast.precipitation | float(0) }}"
      rain_threshold: !input rain_skip_threshold
      temp_cold: !input temp_cold_threshold
      temp_hot: !input temp_hot_threshold
      duration_cold: !input duration_cold
      duration_medium: !input duration_medium
      duration_hot: !input duration_hot
      gießdauer_min: >
        {% if max_temp <= temp_cold %}
          {{ duration_cold }}
        {% elif max_temp >= temp_hot %}
          {{ duration_hot }}
        {% else %}
          {{ duration_medium }}
        {% endif %}
      vorlauf_min: "{{ gießdauer_min }}"

  - if:
      - condition: template
        value_template: "{{ niederschlag >= rain_threshold }}"
    then:
      - action: logbook.log
        data:
          name: Garten Bewässerung
          message: >
            Übersprungen – Niederschlag {{ niederschlag }} mm
            (Schwelle {{ rain_threshold }} mm)
    else:
      - delay:
          seconds: 0
      - wait_for_trigger:
          - trigger: time
            at: >
              {{ (as_datetime(state_attr('sun.sun', 'next_rising'))
                  - timedelta(minutes=vorlauf_min | int))
                  .strftime('%H:%M:%S') }}
        timeout:
          minutes: 5
        continue_on_timeout: true

      # ===== VENTIL ÖFFNEN + STATUSPRÜFUNG =====
      - action: switch.turn_on
        target:
          entity_id: !input valve_entity

      - delay:
          seconds: !input status_check_delay

      - if:
          - condition: state
            entity_id: !input valve_entity
            state: "on"
        then:
          - action: logbook.log
            data:
              name: Garten Bewässerung
              message: >
                Ventil geöffnet erfolgreich.
                Gießdauer: {{ gießdauer_min }} min
                (Max-Temp: {{ max_temp }}°C)
        else:
          - action: !input notify_service
            data:
              title: "⚠️ Garten Bewässerung – Fehler"
              message: >
                Ventil konnte nicht geöffnet werden!
                Entity: {{ valve_entity }}
                State: {{ states(valve_entity) }}
          - stop: Ventil öffnen fehlgeschlagen

      - delay:
          minutes: "{{ gießdauer_min | int }}"

      # ===== VENTIL SCHLIESSEN + STATUSPRÜFUNG =====
      - action: switch.turn_off
        target:
          entity_id: !input valve_entity

      - delay:
          seconds: !input status_check_delay

      - if:
          - condition: state
            entity_id: !input valve_entity
            state: "off"
        then:
          - action: logbook.log
            data:
              name: Garten Bewässerung
              message: "Ventil geschlossen erfolgreich."
        else:
          - action: !input notify_service
            data:
              title: "⚠️ Garten Bewässerung – Fehler"
              message: >
                Ventil konnte nicht geschlossen werden!
                Entity: {{ valve_entity }}
                State: {{ states(valve_entity) }}
          - stop: Ventil schließen fehlgeschlagen

mode: single
max_exceeded: silent