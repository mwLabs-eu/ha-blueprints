blueprint:
  name: Garten Bewässerung – Wetterbasiert (Sonoff Zigbee Valve)
  description: >
    Steuert ein Sonoff Zigbee-Ventil (Z2M) zur Gartenbewässerung.
    Gießzeit und Vorlaufzeit vor Sonnenaufgang werden anhand der
    maximal vorhergesagten Tagestemperatur (weather.get_forecasts, daily)
    dynamisch bestimmt. Regen-Skip inklusive.
  domain: automation
  input:
    valve_entity:
      name: Ventil-Entity
      selector:
        entity:
          domain: switch
    weather_entity:
      name: Wetter-Entity
      selector:
        entity:
          domain: weather
    temp_cold_threshold:
      name: Schwelle "kalt" (°C, max. Tagestemperatur darunter)
      default: 18
      selector:
        number:
          min: 0
          max: 40
          unit_of_measurement: "°C"
    temp_hot_threshold:
      name: Schwelle "heiß" (°C, max. Tagestemperatur darüber)
      default: 28
      selector:
        number:
          min: 0
          max: 45
          unit_of_measurement: "°C"
    duration_cold:
      name: Gießdauer bei kaltem Wetter (Minuten)
      default: 5
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
    duration_medium:
      name: Gießdauer bei mittlerem Wetter (Minuten)
      default: 10
      selector:
        number:
          min: 0
          max: 180
          unit_of_measurement: min
    duration_hot:
      name: Gießdauer bei heißem Wetter (Minuten)
      default: 20
      selector:
        number:
          min: 0
          max: 240
          unit_of_measurement: min
    rain_skip_threshold:
      name: Regen-Schwelle für Skip (mm, Tagessumme)
      default: 2
      selector:
        number:
          min: 0
          max: 50
          unit_of_measurement: mm

trigger:
  - trigger: sun
    event: sunrise
    offset: "-02:00:00"

condition: []

action:
  - action: weather.get_forecasts
    target:
      entity_id: !input weather_entity
    data:
      type: daily
    response_variable: forecast_response

  - variables:
      weather_entity_id: !input weather_entity
      heutiges_forecast: "{{ forecast_response[weather_entity_id].forecast[0] }}"
      max_temp: "{{ heutiges_forecast.temperature | float(0) }}"
      niederschlag: "{{ heutiges_forecast.precipitation | float(0) }}"
      cold_threshold: !input temp_cold_threshold
      hot_threshold: !input temp_hot_threshold
      rain_threshold: !input rain_skip_threshold
      duration_cold_min: !input duration_cold
      duration_medium_min: !input duration_medium
      duration_hot_min: !input duration_hot
      gießdauer_min: >
        {% if max_temp < cold_threshold %}
          {{ duration_cold_min }}
        {% elif max_temp >= hot_threshold %}
          {{ duration_hot_min }}
        {% else %}
          {{ duration_medium_min }}
        {% endif %}
      vorlauf_min: "{{ gießdauer_min }}"

  - if:
      - condition: template
        value_template: "{{ niederschlag >= rain_threshold }}"
    then:
      - action: logbook.log
        data:
          name: Garten Bewässerung
          message: >
            Übersprungen – Niederschlag {{ niederschlag }} mm
            (Schwelle {{ rain_threshold }} mm)
    else:
      - delay:
          seconds: 0
      - wait_for_trigger:
          - trigger: time
            at: >
              {{ (as_datetime(state_attr('sun.sun', 'next_rising'))
                  - timedelta(minutes=vorlauf_min | int))
                  .strftime('%H:%M:%S') }}
        timeout:
          minutes: 5
        continue_on_timeout: true

      - action: switch.turn_on
        target:
          entity_id: !input valve_entity

      - delay:
          minutes: "{{ gießdauer_min | int }}"

      - action: switch.turn_off
        target:
          entity_id: !input valve_entity

mode: single
max_exceeded: silent